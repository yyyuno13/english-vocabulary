name: Build vocabulary HTML
on:
  push:
    paths:
      - 'words/entries.json'
      - 'words/root-map.json'
      - 'words/synonym-root-links.json'
      - 'templates/index.template.html'
      - 'scripts/build-vocabulary.cjs'
      - '.github/workflows/build-vocabulary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize latest vocabulary sources
        run: |
          # Entry and root-map files can be committed separately by the API.
          # Always build from the latest main rather than the triggering commit.
          git fetch origin main
          git checkout -B main origin/main
      - name: Generate and validate vocabulary
        run: |
          node scripts/build-vocabulary.cjs
          node scripts/build-vocabulary.cjs --check
      - name: Commit generated HTML if changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'build: regenerate vocabulary HTML from JSON'
            # Another commit may have landed while this job was generating HTML.
            # Rebase the generated index.html commit before pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo 'Failed to push generated HTML after retries' >&2
            exit 1
          fi
