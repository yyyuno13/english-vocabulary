name: Build vocabulary HTML
on:
  push:
    paths:
      - 'words/entries.json'
      - 'templates/index.template.html'
      - 'scripts/build-vocabulary.cjs'
      - '.github/workflows/build-vocabulary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate vocabulary
        run: |
          node scripts/build-vocabulary.cjs
          node scripts/build-vocabulary.cjs --check
      - name: Commit generated HTML if changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'build: regenerate vocabulary HTML from JSON'
            git push
          fi
