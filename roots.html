<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英単語ノート｜語源別・キーワード別</title><style>:root{--bg:#f7f7f5;--paper:#fff;--text:#222;--muted:#666;--line:#ddd;--accent:#245f73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px 16px 60px}h1{font-size:1.7rem;margin:0}.sub{color:var(--muted);margin:4px 0 18px}.tabs{display:none!important}.tabs button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:#fff;color:var(--text);font:inherit}.tabs button[aria-selected=true]{background:var(--accent);color:white}.frame{display:block;width:100%;height:900px;min-height:0;border:0;border-radius:0;background:white;overflow:hidden}.panel[hidden]{display:none}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:200px;padding:12px;border:1px solid #bbb;border-radius:10px;font:inherit}.count{color:var(--muted);align-self:center}.root-layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px;align-items:start}.root-toc{position:relative;top:auto;max-height:none;overflow:visible;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px}.root-toc h2{font-size:1rem;margin:0 0 8px}.root-toc a{display:block;padding:5px 3px;color:var(--accent);text-decoration:none;border-bottom:1px solid #eee;font-size:.92rem}.root-toc a:hover{text-decoration:underline}.root-toc details summary{cursor:pointer;font-weight:700}.root-toc details{margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.root-fab{position:fixed;right:14px;top:calc(66px + env(safe-area-inset-top,0px));z-index:100;background:var(--accent);color:white!important;text-decoration:none;padding:10px 14px;border-radius:999px;box-shadow:0 4px 16px #0003}.root-fab[hidden]{display:none}.mode-menu-toggle{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:301;border:0;border-radius:12px;background:var(--accent);color:white;width:48px;height:46px;font-size:26px;line-height:1;box-shadow:0 4px 16px #0003;cursor:pointer}.mode-menu{position:fixed;right:14px;top:calc(64px + env(safe-area-inset-top,0px));z-index:302;min-width:210px;background:white;border:1px solid var(--line);border-radius:12px;padding:7px;box-shadow:0 8px 24px #0003}.mode-menu[hidden]{display:none}.mode-menu button{display:block;width:100%;padding:12px;text-align:left;border:0;border-radius:8px;background:transparent;color:var(--text);font:inherit;cursor:pointer}.mode-menu button[aria-current=true]{background:#edf4f5;color:var(--accent);font-weight:700}.group{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;scroll-margin-top:20px}.group h2{margin:0;font-size:1.2rem;color:var(--accent)}.origin{color:var(--muted);font-size:.9rem;margin:0 0 12px}.word{padding:9px 0;border-top:1px solid #eee}.word a{color:var(--accent);font-weight:700;text-decoration:none}.word a:hover{text-decoration:underline}.word small{display:block;color:var(--muted)}.note{background:#edf4f5;padding:12px 14px;border-radius:10px;margin:0 0 18px;font-size:.92rem}.foot{margin-top:20px;color:var(--muted);font-size:.9rem}a{color:var(--accent)}@media(max-width:760px){.root-layout{display:block}.root-toc{position:relative;top:auto;max-height:none;margin-bottom:14px}.root-toc details:not([open]) #root-toc-links{display:none}}@media(max-width:600px){.wrap{padding:14px 10px}.tabs button{flex:1;padding:10px}.frame{min-height:0}}</style></head><body><div class="wrap"><h1>英単語ノート</h1><p class="sub">キーワード別の詳細解説と、語源別の横断学習を切り替え</p><div class="tabs" role="tablist" aria-label="学習モード"><button id="tab-key" role="tab" aria-selected="false" aria-controls="panel-key">① キーワード別</button><button id="tab-root" role="tab" aria-selected="true" aria-controls="panel-root">② 語源別</button></div><section id="panel-key" class="panel" role="tabpanel" hidden><iframe class="frame" title="従来のキーワード別単語帳" loading="lazy" data-src="./index.html"></iframe></section><section id="panel-root" class="panel" role="tabpanel"><p class="note">同じ語源に由来する単語をまとめています。語源が不確かなものは「その他」に分類。語源系列の関連語を掲載し、類義語は混在させません。単語を押すと①の詳細解説へ移動します。</p><div class="toolbar"><input id="search" type="search" placeholder="語源・単語・意味で検索" aria-label="語源を検索"><span id="count" class="count"></span></div><div class="root-layout"><nav id="root-toc" class="root-toc" aria-label="語源別目次"><h2>語源別目次（ABC順）</h2><details open><summary>目次を開閉</summary><div id="root-toc-links">読み込み中…</div></details></nav><div id="groups" class="grid"><p>単語データを読み込んでいます…</p></div></div><p class="foot">分類は登録済み単語の語源説明に基づきます。語源的な同族関係と、意味が近いだけの類義語は区別しています。</p></section><button id="mode-menu-toggle" class="mode-menu-toggle" aria-label="学習モードを切り替え" aria-expanded="false" aria-controls="mode-menu">☰</button><nav id="mode-menu" class="mode-menu" aria-label="学習モード" hidden><button id="mode-key" type="button">① キーワード別</button><button id="mode-root" type="button">② 語源別</button></nav><a href="#root-toc" id="root-fab" class="root-fab" aria-label="語源別目次へ戻る">↑ 目次</a></div><script>const rootMap={"speculation":["spec-/spect-","specere｜見る"],"pave":["pav-","pavire｜踏み固める"],"candidly":["cand-","candere｜白く輝く"],"prominent":["min-","minere｜突き出る"],"preside":["sed-/sid-","sedere｜座る"],"literature":["liter-","littera｜文字"],"malfunction":["funct-","fungi｜遂行する"],"incorporate":["corpor-","corpus｜身体"],"signify":["sign-","signum｜しるし"],"intriguing":["tric-","tricae｜もつれ"],"infrared":["infra-","infra｜下に"],"faint":["fing-/feign-","fingere｜形作る・装う"],"apparent":["par-","parere｜現れる"],"transparent":["par-","parere｜現れる"],"prevail":["val-","valere｜強い"],"plausible":["plaud-/plaus-","plaudere｜拍手する"],"provincial":["その他","語源の深部が不確か"],"converge":["verg-","vergere｜傾く・向かう"],"compromise":["mitt-/miss-","mittere｜送る・約束する"],"disruption":["rupt-","rumpere｜破る"],"reduce":["duc-/duct-","ducere｜導く"],"prosper":["その他","語源の深部が不確か"],"divert":["vert-/vers-","vertere｜回す"],"shimmering":["その他","語源の詳細が不確か"],"conventional":["ven-/vent-","venire｜来る"],"dimension":["mens-/met-","metiri｜測る"],"jury":["jur-","jurare｜誓う"],"visibility":["vis-/vid-","videre｜見る"],"pigment":["pict-/ping-","pingere｜描く"],"narrative":["narr-","narrare｜語る"],"preserve":["serv-","servare｜守る"]};const $=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let dataset=[];function switchTab(name){const key=name==='key';$('panel-key').hidden=!key;$('panel-root').hidden=key;$('tab-key').setAttribute('aria-selected',String(key));$('tab-root').setAttribute('aria-selected',String(!key));if(key){const f=document.querySelector('iframe');if(!f.src)f.src=f.dataset.src}history.replaceState(null,'',key?'#keywords':'#roots')}function render(){const q=$('search').value.trim().toLowerCase();const groups=new Map();for(const e of dataset){const [id,origin]=rootMap[e.id]||['その他','語源分類を要確認'];if(!groups.has(id))groups.set(id,{origin,words:new Map()});const g=groups.get(id);const add=(w,meaning,head)=>{const k=w.toLowerCase();if(!g.words.has(k))g.words.set(k,{w,meaning,head})};add(e.word,e.meaning,true);for(const r of e.related||[])add(r.word,r.meaning,false)}const sorted=[...groups.entries()].sort((a,b)=>a[0]==='その他'?1:b[0]==='その他'?-1:a[0].localeCompare(b[0],'en',{sensitivity:'base'}));let visible=0;const markup=sorted.map(([root,g])=>{const words=[...g.words.values()].filter(w=>(root+' '+g.origin+' '+w.w+' '+w.meaning).toLowerCase().includes(q));if(!words.length)return '';visible++;return '<article class="group"><h2>'+escapeHTML(root)+'</h2><p class="origin">'+escapeHTML(g.origin)+' ・ '+words.length+'語</p>'+words.map(w=>'<div class="word"><a href="#keywords" data-word="'+escapeHTML(w.head?w.w:findParent(root,w.w))+'" title="キーワード別で詳細を見る">'+escapeHTML(w.w)+'</a><small>'+escapeHTML(w.meaning)+'</small></div>').join('')+'</article>'}).join('');$('groups').innerHTML=markup||'<p>該当する語源・単語はありません。</p>';$('count').textContent=visible+'語源グループ'}function findParent(root,word){const e=dataset.find(e=>(rootMap[e.id]||['その他'])[0]===root&&(e.related||[]).some(r=>r.word===word));return e?e.id:word}document.querySelectorAll('[role=tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.id==='tab-key'?'key':'root')));$('search').addEventListener('input',render);const startupHash=location.hash;switchTab(startupHash==='#keywords'?'key':'root');if(startupHash&&startupHash!=='#roots'&&startupHash!=='#keywords')history.replaceState(null,'',startupHash);fetch('./words/entries.json?v=roots-20261024').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{dataset=d.entries||[];render()}).catch(e=>{$('groups').textContent='読み込みに失敗しました: '+e.message});</script><script>
/* Keep both learning modes inside this page, including deep links. */
(function(){
 const frame=document.querySelector('#panel-key iframe');
 const groupBox=document.getElementById('groups');
 const originalSwitch=switchTab;
 function showWord(word){
   originalSwitch('key');
   document.getElementById('root-fab').hidden=false;
   updateModeMenu();
   const target='./index.html#'+encodeURIComponent(word);
   frame.src=target;
   history.replaceState(null,'','#word='+encodeURIComponent(word));
 }
 function showRoot(root){
   originalSwitch('root');
   document.getElementById('root-fab').hidden=false;
   updateModeMenu();
   document.getElementById('search').value='';
   render();
   const target=document.getElementById('root-'+encodeURIComponent(root));
   if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
   history.replaceState(null,'','#root='+encodeURIComponent(root));
 }
 groupBox.addEventListener('click',e=>{
   const a=e.target.closest('a[data-word]');
   if(!a)return;
   e.preventDefault();showWord(a.dataset.word);
 });
 const originalRender=render;
 render=function(){
   originalRender();
   const toc=document.getElementById('root-toc-links');
   const links=[];
   for(const card of groupBox.querySelectorAll('.group')){
     const title=card.querySelector('h2');
     if(title){card.id='root-'+encodeURIComponent(title.textContent);links.push('<a href="#'+card.id+'">'+escapeHTML(title.textContent)+'</a>');}
   }
   toc.innerHTML=links.join('')||'<span>該当なし</span>';
 };
 document.getElementById('root-toc-links').addEventListener('click',e=>{const a=e.target.closest('a[href^="#root-"]');if(!a)return;e.preventDefault();const el=document.getElementById(a.getAttribute('href').slice(1));if(el){el.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#root='+encodeURIComponent(el.querySelector('h2').textContent));}});
 document.getElementById('root-fab').addEventListener('click',e=>{e.preventDefault();if(!document.getElementById('panel-root').hidden){document.getElementById('root-toc').scrollIntoView({behavior:'smooth',block:'start'});}else{const doc=frame.contentDocument;if(doc){const toc=doc.getElementById('toc')||doc.querySelector('.toc');if(toc)toc.scrollIntoView({behavior:'smooth',block:'start'});else doc.defaultView.scrollTo({top:0,behavior:'smooth'});}frame.scrollIntoView({behavior:'smooth',block:'start'});}});
 function attach(){
   try{
     const doc=frame.contentDocument;
     if(!doc||!doc.body)return;
     // Expand the embedded document to its full height. Without this, the iframe
     // creates a second scrolling viewport and the outer heading appears frozen.
     doc.documentElement.style.overflow='visible';
     doc.body.style.overflow='visible';
     frame.setAttribute('scrolling','no');
     frame.style.overflow='hidden';
     const resizeFrame=()=>{
       if(frame.contentDocument!==doc)return;
       const height=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight,doc.documentElement.offsetHeight,doc.body.offsetHeight);
       if(height>0)frame.style.height=(height+12)+'px';
     };
     if(!doc.__keywordResizeInstalled){
       doc.__keywordResizeInstalled=true;
       if(typeof ResizeObserver!=='undefined'){
         const observer=new ResizeObserver(resizeFrame);
         observer.observe(doc.body);
         observer.observe(doc.documentElement);
       }
       doc.addEventListener('input',resizeFrame,true);
       doc.addEventListener('toggle',resizeFrame,true);
       doc.addEventListener('click',()=>setTimeout(resizeFrame,50),true);
     }
     resizeFrame();
     // Keep the original compact top-right TOC shortcut; no sticky navigation bar.
     const oldNav=doc.getElementById('return-to-roots');
     if(oldNav)oldNav.remove();
     const css=doc.getElementById('embedded-keyword-layout');
     if(!css){
       const style=doc.createElement('style');
       style.id='embedded-keyword-layout';
       style.textContent='.toolbar{position:static!important;top:auto!important;backdrop-filter:none!important}.toc{position:static!important;top:auto!important;max-height:none!important}.toc-fab{display:none!important}';
       doc.head.appendChild(style);
     }
   }catch(err){console.warn('Cross-view links unavailable',err)}
 }
 frame.addEventListener('load',()=>{
   attach();
   // The legacy vocabulary loader creates sections asynchronously.
   setTimeout(attach,350);
   setTimeout(attach,1200);
 });
 const menuToggle=document.getElementById('mode-menu-toggle');
 const modeMenu=document.getElementById('mode-menu');
 function updateModeMenu(){const key=!document.getElementById('panel-key').hidden;document.getElementById('mode-key').setAttribute('aria-current',String(key));document.getElementById('mode-root').setAttribute('aria-current',String(!key));}
 function closeModeMenu(){modeMenu.hidden=true;menuToggle.setAttribute('aria-expanded','false');}
 menuToggle.addEventListener('click',()=>{modeMenu.hidden=!modeMenu.hidden;menuToggle.setAttribute('aria-expanded',String(!modeMenu.hidden));});
 document.getElementById('mode-key').addEventListener('click',()=>{document.getElementById('tab-key').click();closeModeMenu();});
 document.getElementById('mode-root').addEventListener('click',()=>{document.getElementById('tab-root').click();closeModeMenu();});
 document.addEventListener('click',e=>{if(!modeMenu.contains(e.target)&&e.target!==menuToggle)closeModeMenu();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModeMenu();});
 document.getElementById('tab-key').addEventListener('click',()=>{document.getElementById('root-fab').hidden=false;updateModeMenu();history.replaceState(null,'','#keywords')});
 document.getElementById('tab-root').addEventListener('click',()=>{document.getElementById('root-fab').hidden=false;updateModeMenu();history.replaceState(null,'','#roots')});
 document.getElementById('root-fab').hidden=false;updateModeMenu();
 const initial=decodeURIComponent(location.hash.slice(1));
 if(initial.startsWith('word='))showWord(initial.slice(5));
 else if(initial.startsWith('root=')){const root=initial.slice(5);setTimeout(()=>showRoot(root),650)}
})();
</script></body></html>
