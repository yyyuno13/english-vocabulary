<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">resign のコアイメージ</title><desc id="desc">自分の手から職務や役職を手放す意味と、抵抗や期待を手放して諦めて受け入れる意味を示す図。</desc><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><g font-family="sans-serif"><text x="30" y="51" font-size="29" font-weight="700" fill="#245f73">resign</text><text x="30" y="81" font-size="18" fill="#536770">握っていたものを手放す</text><rect x="29" y="106" width="782" height="220" rx="12" fill="#f2f7f8"/><rect x="301" y="120" width="238" height="63" rx="14" fill="#dceef3" stroke="#83aab8" stroke-width="2"/><text x="420" y="160" font-size="25" font-weight="700" fill="#245f73" text-anchor="middle">手放す / let go</text><path d="M420 183V211H213V227M420 211H627V227" fill="none" stroke="#638b9b" stroke-width="4"/><rect x="75" y="227" width="275" height="77" rx="13" fill="#e7edf5" stroke="#a0b4cb" stroke-width="2"/><rect x="490" y="227" width="275" height="77" rx="13" fill="#f6ece0" stroke="#c9ae89" stroke-width="2"/><text x="213" y="261" font-size="21" fill="#405d7a" font-weight="700" text-anchor="middle">職務・役職を手放す</text><text x="213" y="286" font-size="17" fill="#405d7a" text-anchor="middle">辞職・辞任</text><text x="627" y="261" font-size="21" fill="#8b6434" font-weight="700" text-anchor="middle">抵抗・期待を手放す</text><text x="627" y="286" font-size="17" fill="#8b6434" text-anchor="middle">諦めて受け入れる</text></g></svg>