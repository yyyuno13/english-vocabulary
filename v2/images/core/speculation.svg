<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">speculation core image</title><desc id="desc">観測された事実を基に未確定の仮説AとBを考える図。</desc><defs><marker id="blueArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26738a"/></marker><marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#db934b"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dbe5e9" stroke-width="2"/><text x="32" y="48" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="28" font-weight="750" fill="#245f73">speculation</text><text x="32" y="79" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="400" fill="#536974">手がかりを基に、未確定の可能性を考える</text><rect x="26" y="101" width="788" height="227" rx="12" fill="#f2f7f8" stroke="none" stroke-width="2"/><rect x="67" y="148" width="226" height="128" rx="12" fill="#e3f1f3" stroke="#26738a" stroke-width="2"/><text x="180" y="186" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="20" font-weight="700" fill="#245f73">観測・手がかり</text><text x="180" y="229" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="500" fill="#334b58">確認できる事実</text><path d="M302 210 H423" fill="none" stroke="#26738a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)" /><circle cx="475" cy="210" r="32" fill="#db934b" stroke="none" stroke-width="2"/><text x="475" y="218" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Goth