<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">malfunction core image</title><desc id="desc">左側で正常に機能していた機器の信号が、右側では異常な信号に変わる図。</desc><defs><marker id="blueArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26738a"/></marker><marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#db934b"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dbe5e9" stroke-width="2"/><text x="32" y="48" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="28" font-weight="750" fill="#245f73">malfunction</text><text x="32" y="79" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="400" fill="#536974">本来の機能が正常に働かず、誤作動・故障する</text><rect x="26" y="101" width="788" height="227" rx="12" fill="#f2f7f8" stroke="none" stroke-width="2"/><rect x="75" y="138" width="260" height="156" rx="12" fill="#e2f2eb" stroke="#67a88c" stroke-width="2"/><text x="205" y="173" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="20" font-weight="700" fill="#257759">正常な動作</text><path d="M116 231 L166 231 L185 205 L212 247 L238 222 L294 222" fill="none" stroke="#3a9870" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"  /><circle cx="292" cy="158" r="13" fill="#3a9870" stroke="none" stroke-width="2"/><text x="292" y="165" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="700" fill="#fff">✓</text>
<path d="M360 215 L475 215" fill="none" stroke="#26738a" stroke-width="4" stroke-linecap="round" marker-end="url(#blueArrow)" />
<rect x="502" y="138" width="260" height="156" rx="12" fill="#fff0ea" stroke="#e3a08c" stroke-width="2"/><text x="633" y="173" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="20" font-weight="700" fill="#ab5e48">異常な動作</text><path d="M541 238L577 217L608 253L631 183L673 234L719 202" fill="none" stroke="#d67860" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"  /><circle cx="717" cy="157" r="15" fill="#d67860" stroke="none" stroke-width="2"/><text x="717" y="165" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="21" font-weight="700" fill="#fff">!</text><text x="420" y="316" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="17" font-weight="500" fill="#536974">停止だけでなく、誤作動も含む</text></svg>