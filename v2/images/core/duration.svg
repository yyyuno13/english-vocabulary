<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" role="img" aria-labelledby="t d"><title id="t">duration のコアイメージ</title><desc id="d">開始から終了までの時間幅を示すタイムライン。</desc><rect width="840" height="310" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="308" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><g font-family="sans-serif"><text x="32" y="58" font-size="32" font-weight="700" fill="#245f73">duration</text><text x="32" y="88" font-size="18" fill="#536770">ある出来事が、開始から終了までどれだけ続くか</text><line x1="92" y1="194" x2="748" y2="194" stroke="#a3abb4" stroke-width="5"/><rect x="185" y="168" width="470" height="52" rx="12" fill="#dbeaf1" stroke="#789daf" stroke-width="2"/><line x1="185" y1="146" x2="185" y2="238" stroke="#356e86" stroke-width="4"/><line x1="655" y1="146" x2="655" y2="238" stroke="#356e86" stroke-width="4"/><text x="185" y="134" font-size="20" text-anchor="middle" fill="#315f73">開始</text><text x="655" y="134" font-size="20" text-anchor="middle" fill="#315f73">終了</text><text x="420" y="202" font-size="25" font-weight="700" text-anchor="middle" fill="#315f73">duration</text><text x="420" y="270" font-size="18" text-anchor="middle" fill="#536770">2つの時点の間にある時間の幅</text></g></svg>