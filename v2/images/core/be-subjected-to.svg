<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">be subjected to のコアイメージ</title><desc id="desc">外部の力や検査・批判などが人や物に一方的に作用する図。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a5684a"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><g font-family="sans-serif"><text x="30" y="51" font-size="29" fill="#245f73" font-weight="700">be subjected to ...</text><text x="30" y="82" font-size="18" fill="#536770">外部からの作用・処置を受ける</text><rect x="150" y="108" width="540" height="85" rx="14" fill="#f5e8e0" stroke="#c79c84" stroke-width="2"/><text x="420" y="144" font-size="25" fill="#92593d" font-weight="700" text-anchor="middle">外部の力・作用</text><text x="420" y="174" font-size="18" fill="#92593d" text-anchor="middle">pressure / scrutiny / testing</text><path d="M420 196V237" stroke="#a5684a" stroke-width="7" marker-end="url(#a)"/><rect x="150" y="257" width="540" height="76" rx="14" fill="#e4eef3" stroke="#8caebe" stroke-width="2"/><text x="420" y="289" font-size="24" fill="#315e73" font-weight="700" text-anchor="middle">影響を受ける人・物</text><text x="420" y="316" font-size="18" fill="#315e73" text-anchor="middle">be subjected to ...</text></g></svg>