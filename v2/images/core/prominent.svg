<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">prominent core image</title><desc id="desc">高さのそろった棒の中に一つだけ高く突き出した棒があり目立つ様子。</desc><defs><marker id="blueArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26738a"/></marker><marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#db934b"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dbe5e9" stroke-width="2"/><text x="32" y="48" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="28" font-weight="750" fill="#245f73">prominent</text><text x="32" y="79" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="400" fill="#536974">周囲より前・上へ突出し、自然に目立つ</text><rect x="26" y="101" width="788" height="227" rx="12" fill="#f2f7f8" stroke="none" stroke-width="2"/><path d="M87 280 L757 280" fill="none" stroke="#93a8b0" stroke-width="3" stroke-linecap="round"  /><rect x="135" y="199" width="55" height="81" rx="12" fill="#bcd5dc" stroke="none" stroke-width="2"/><rect x="227" y="199" width="55" height="81" rx="12" fill="#bcd5dc" stroke="none" stroke-width="2"/><rect x="319" y="199" width="55" height="81" rx="12" fill="#bcd5dc" stroke="none" stroke-width="2"/><rect x="503" y="199" width="55" height="81" rx="12" fill="#bcd5dc" stroke="none" stroke-width="2"/><rect x="595" y="199" width="55" height="81" rx="12" fill="#bcd5dc" stroke="none" stroke-width="2"/><rect x="687" y="199" width="55" height="81" rx="12" fill="#bcd5dc" stroke="none" stroke-width="2"/><rect x="410" y="122" width="65" height="158" rx="12" fill="#26738a" stroke="none" stroke-width="2"/><text x="443" y="110" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="19" font-weight="700" fill="#245f73">目立つ</text><path d="M444 186 V144" fill="none" stroke="#db934b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orangeArrow)" /><text x="413" y="311" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="600" fill="#344653">突出 → 目立つ → 著名・重要</text></svg>