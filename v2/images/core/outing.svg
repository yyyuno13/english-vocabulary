<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="t d"><title id="t">outing のコアイメージ</title><desc id="d">out（外へ）から外出と秘密の暴露という二つの意味に分かれる図。</desc><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><g font-family="sans-serif"><text x="28" y="51" font-size="30" font-weight="700" fill="#245f73">outing</text><text x="28" y="82" font-size="18" fill="#536770">out（外へ）＋ -ing</text><rect x="292" y="100" width="256" height="77" rx="14" fill="#e7eaf5" stroke="#9fa5c8" stroke-width="2"/><text x="420" y="133" font-size="25" font-weight="700" text-anchor="middle" fill="#525b91">OUT</text><text x="420" y="158" font-size="18" text-anchor="middle" fill="#525b91">内側 → 外側</text><path d="M420 177V215H210V233M420 215H630V233" stroke="#8b8fa9" stroke-width="4" fill="none"/><rect x="50" y="233" width="320" height="91" rx="13" fill="#e6f1e9" stroke="#9abd9e" stroke-width="2"/><rect x="470" y="233" width="320" height="91" rx="13" fill="#f8e9e3" stroke="#d4a694" stroke-width="2"/><text x="210" y="267" font-size="23" font-weight="700" text-anchor="middle" fill="#3e7a53">外へ出かける</text><text x="210" y="298" font-size="18" text-anchor="middle" fill="#3e7a53">小旅行・遠足</text><text x="630" y="267" font-size="23" font-weight="700" text-anchor="middle" fill="#a15e49">秘密を外へ出す</text><text x="630" y="298" font-size="18" text-anchor="middle" fill="#a15e49">同意なき暴露</text></g></svg>