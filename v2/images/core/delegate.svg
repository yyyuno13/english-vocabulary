<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">delegate core image</title><desc id="desc">左の責任者から右の担当者へ仕事と権限を移す図。</desc><defs><marker id="blueArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26738a"/></marker><marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#db934b"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dbe5e9" stroke-width="2"/><text x="32" y="48" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="28" font-weight="750" fill="#245f73">delegate</text><text x="32" y="79" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="400" fill="#536974">自分が持つ仕事・権限を、他の人に任せる</text><rect x="26" y="101" width="788" height="227" rx="12" fill="#f2f7f8" stroke="none" stroke-width="2"/><rect x="74" y="148" width="230" height="123" rx="12" fill="#e7f3f5" stroke="#26738a" stroke-width="2"/><rect x="530" y="148" width="230" height="123" rx="12" fill="#fff2e4" stroke="#db934b" stroke-width="2"/><circle cx="189" cy="175" r="16" fill="#26738a" stroke="none" stroke-width="2"/><text x="188" y="226" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="21" font-weight="700" fill="#245f73">自分</text><text x="188" y="251" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="15" font-weight="500" fill="#334b58">責任者</text><circle cx="646" cy="175" r="16" fill="#db934b" stroke="none" stroke-width="2"/><text x="646" y="226" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="21" font-weight="700" fill="#ad6b2b">担当者</text>
<path d="M317 204 H518" fill="none" stroke="#26738a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)" /><text x="418" y="181" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="650" fill="#344653">仕事・権限を移す</text><text x="420" y="306" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="17" font-weight="500" fill="#536974">任せるが、責任の所在は別途明確にする</text></svg>