<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="t d"><title id="t">rave のコアイメージ</title><desc id="d">強い感情表現が肯定的な絶賛と否定的なわめきに分かれる図。</desc><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><g font-family="sans-serif"><text x="28" y="52" font-size="31" font-weight="700" fill="#245f73">rave</text><text x="28" y="83" font-size="19" fill="#536770">感情が高まり、抑えきれずに激しく表現する</text><rect x="286" y="105" width="268" height="76" rx="14" fill="#e7eaf5" stroke="#9fa5c8" stroke-width="2"/><text x="420" y="135" font-size="25" font-weight="700" text-anchor="middle" fill="#525b91">rave</text><text x="420" y="162" font-size="17" text-anchor="middle" fill="#525b91">激しい感情表現</text><path d="M420 181V217H210V238M420 217H630V238" stroke="#8b8fa9" stroke-width="4" fill="none"/><rect x="53" y="238" width="314" height="87" rx="13" fill="#e6f1e9" stroke="#9abd9e" stroke-width="2"/><rect x="473" y="238" width="314" height="87" rx="13" fill="#f8e9e3" stroke="#d4a694" stroke-width="2"/><text x="210" y="273" font-size="23" font-weight="700" text-anchor="middle" fill="#3e7a53">肯定的な感情</text><text x="210" y="303" font-size="19" text-anchor="middle" fill="#3e7a53">熱狂的に褒める</text><text x="630" y="273" font-size="23" font-weight="700" text-anchor="middle" fill="#a15e49">否定的な感情</text><text x="630" y="303" font-size="19" text-anchor="middle" fill="#a15e49">興奮してわめく</text></g></svg>