<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">call for のコアイメージ</title><desc id="desc">状況や問題から必要な行動・支援を求める矢印が伸びる図。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24738a"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><g font-family="sans-serif"><text x="32" y="51" font-size="29" fill="#245f73" font-weight="700">call for</text><text x="32" y="82" font-size="18" fill="#536770">状況が必要なものを求める・対応を要求する</text><rect x="28" y="105" width="784" height="222" rx="12" fill="#f2f7f8"/><rect x="67" y="148" width="257" height="136" rx="16" fill="#e5eef1" stroke="#83aab8" stroke-width="2"/><text x="195" y="200" font-size="25" fill="#315e6d" font-weight="700" text-anchor="middle">状況・問題</text><text x="195" y="241" font-size="19" fill="#315e6d" text-anchor="middle">situation / crisis</text><path d="M343 214H499" stroke="#24738a" stroke-width="7" marker-end="url(#a)"/><text x="419" y="190" font-size="20" fill="#245f73" font-weight="700" text-anchor="middle">call for</text><rect x="516" y="148" width="257" height="136" rx="16" fill="#e6f3e9" stroke="#75a88a" stroke-width="2"/><text x="645" y="200" font-size="25" fill="#276d4c" font-weight="700" text-anchor="middle">必要な対応</text><text x="645" y="241" font-size="19" fill="#276d4c" text-anchor="middle">action / help</text><text x="420" y="311" font-size="17" fill="#536770" text-anchor="middle">This situation calls for immediate action.</text></g></svg>