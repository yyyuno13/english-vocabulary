<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">fancy のコアイメージ</title><desc id="desc">頭の中に浮かぶ魅力的なイメージから、想像する・気に入る・凝った特別なもの、という意味に広がる図。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24738a"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><g font-family="sans-serif"><text x="32" y="50" font-size="29" fill="#245f73" font-weight="700">fancy</text><text x="32" y="81" font-size="18" fill="#536770">心に浮かぶイメージ → 好み・魅力・凝ったもの</text><rect x="29" y="106" width="782" height="223" rx="12" fill="#f2f7f8"/><circle cx="139" cy="202" r="43" fill="#c7dce3"/><path d="M88 283Q138 241 190 283" fill="#c7dce3"/><path d="M188 205H260" stroke="#24738a" stroke-width="4" marker-end="url(#a)"/><rect x="275" y="143" width="202" height="121" rx="18" fill="#fff5e8" stroke="#dba357" stroke-width="3"/><path d="M376 157L387 185L418 187L394 207L401 237L376 220L351 237L358 207L334 187L365 185Z" fill="#dba357"/><text x="376" y="286" font-size="17" fill="#ad6b2b" text-anchor="middle">心に浮かぶ特別な像</text><path d="M488 202H536" stroke="#24738a" stroke-width="4" marker-end="url(#a)"/><rect x="549" y="127" width="233" height="52" rx="10" fill="#dceff3"/><rect x="549" y="189" width="233" height="52" rx="10" fill="#e4f2ea"/><rect x="549" y="251" width="233" height="52" rx="10" fill="#fff0df"/><text x="665" y="160" font-size="19" fill="#245f73" text-anchor="middle">想像する</text><text x="665" y="222" font-size="19" fill="#257759" text-anchor="middle">気に入る・欲しい</text><text x="665" y="284" font-size="19" fill="#ad6b2b" text-anchor="middle">凝った・しゃれた</text></g></svg>