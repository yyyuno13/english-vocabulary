<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title description"><title id="title">divert のコアイメージ</title><desc id="description">行き先Aへ向かっていたものが分岐点で行き先Bへそれる図。</desc><defs><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#24738a"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#e19c52"/></marker></defs><rect width="840" height="360" rx="16" fill="#ffffff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><text x="32" y="51" font-size="29" font-weight="700" fill="#245f73" text-anchor="start">divert</text><text x="32" y="83" font-size="17" font-weight="400" fill="#536770" text-anchor="start">本来の方向から、別の行き先へ向け直す</text>
  <rect x="31" y="111" width="778" height="210" rx="12" fill="#f2f7f8"/>
  <path d="M91 223H366" stroke="#24738a" stroke-width="6" fill="none"/>
  <path d="M366 223H730" stroke="#aebbc0" stroke-width="5" fill="none" stroke-dasharray="11 11"/>
  <path d="M366 223 C431 223 459 158 546 157 H724" stroke="#e19c52" stroke-width="6" fill="none" marker-end="url(#arrowOrange)"/>
  <circle cx="366" cy="223" r="12" fill="#24738a"/>
  <text x="98" y="206" font-size="17" font-weight="700" fill="#245f73" text-anchor="start">もとの流れ</text>
  <text x="595" y="242" font-size="17" font-weight="600" fill="#7f9199" text-anchor="start">本来の進路 A</text>
  <text x="589" y="141" font-size="18" font-weight="700" fill="#ad6b2b" text-anchor="start">別の進路 B</text>
  <text x="364" y="272" font-size="16" font-weight="600" fill="#344653" text-anchor="middle">方向転換</text>
  <text x="416" y="304" font-size="15" font-weight="400" fill="#536770" text-anchor="middle">交通・注意・資金・話題を別の方向へそらす</text>
