<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title description"><title id="title">bounce のコアイメージ</title><desc id="description">ボールの跳ね返りから回復・不達メールの返送への意味の広がり。</desc><defs><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#24738a"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#e19c52"/></marker></defs><rect width="840" height="360" rx="16" fill="#ffffff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><text x="32" y="51" font-size="29" font-weight="700" fill="#245f73" text-anchor="start">bounce</text><text x="32" y="83" font-size="17" font-weight="400" fill="#536770" text-anchor="start">接触・衝突 → 勢いよく跳ね返る</text>
  <rect x="29" y="105" width="260" height="213" rx="12" fill="#f2f7f8"/>
