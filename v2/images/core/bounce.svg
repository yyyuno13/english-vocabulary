  <circle cx="87" cy="169" r="17" fill="#24738a"/><circle cx="229" cy="169" r="17" fill="#e19c52"/>
  <text x="159" y="297" font-size="16" font-weight="600" fill="#344653" text-anchor="middle">跳ね返る</text>
  <path d="M310 207H344" stroke="#9bafb7" stroke-width="3" marker-end="url(#arrowBlue)"/>
