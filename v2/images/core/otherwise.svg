<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="t d"><title id="t">otherwise のコアイメージ</title><desc id="d">現在の状況から別の状況と別の側面に視点が分岐する図。</desc><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><g font-family="sans-serif"><text x="28" y="52" font-size="30" font-weight="700" fill="#245f73">otherwise</text><text x="28" y="82" font-size="18" fill="#536770">other（別の）＋ -wise（方法・点で）</text><rect x="290" y="99" width="260" height="77" rx="14" fill="#e4eef3" stroke="#92afbd" stroke-width="2"/><text x="420" y="132" font-size="24" font-weight="700" text-anchor="middle" fill="#315f73">現在の状況 A</text><text x="420" y="159" font-size="17" text-anchor="middle" fill="#315f73">今述べた内容</text><path d="M420 176V214H210V232M420 214H630V232" stroke="#7899a7" stroke-width="4" fill="none"/><rect x="50" y="232" width="320" height="91" rx="13" fill="#f5e8df" stroke="#cba48d" stroke-width="2"/><rect x="470" y="232" width="320" height="91" rx="13" fill="#e9ecf6" stroke="#a5acd0" stroke-width="2"/><text x="210" y="267" font-size="23" font-weight="700" text-anchor="middle" fill="#8c5d42">別の状況なら</text><text x="210" y="298" font-size="18" text-anchor="middle" fill="#8c5d42">さもなければ</text><text x="630" y="267" font-size="23" font-weight="700" text-anchor="middle" fill="#555f94">別の側面では</text><text x="630" y="298" font-size="18" text-anchor="middle" fill="#555f94">それ以外は</text></g></svg>