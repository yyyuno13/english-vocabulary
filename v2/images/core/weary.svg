<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">weary のコアイメージ</title><desc id="desc">負担が続くにつれてエネルギーが徐々に減り、身体的疲労から精神的なうんざり感へつながる様子。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24738a"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><g font-family="sans-serif"><text x="32" y="51" font-size="29" fill="#245f73" font-weight="700">weary</text><text x="32" y="83" font-size="18" fill="#536770">負担が積み重なり、心身のエネルギーがすり減る</text><rect x="30" y="105" width="780" height="217" rx="12" fill="#f2f7f8"/><text x="62" y="142" font-size="17" fill="#536770">エネルギー</text><path d="M74 172H757" stroke="#a4b6bf" stroke-width="3"/><g fill="#24738a"><rect x="86" y="181" width="76" height="97" rx="6"/><rect x="183" y="201" width="76" height="77" rx="6"/></g><g fill="#7eaeba"><rect x="280" y="218" width="76" height="60" rx="6"/><rect x="377" y="235" width="76" height="43" rx="6"/></g><g fill="#dca266"><rect x="474" y="248" width="76" height="30" rx="6"/><rect x="571" y="258" width="76" height="20" rx="6"/><rect x="668" y="266" width="76" height="12" rx="6"/></g><path d="M94 298H737" stroke="#24738a" stroke-width="3" marker-end="url(#arrow)"/><text x="91" y="316" font-size="15" fill="#344653">負担の開始</text><text x="744" y="316" font-size="15" text-anchor="end" fill="#344653">長期間の負担</text><text x="680" y="160" font-size="18" fill="#ad6b2b" text-anchor="middle">疲労・倦怠感</text></g></svg>