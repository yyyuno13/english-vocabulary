<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">censure のコアイメージ</title><desc id="desc">行動を評価・判断し、不適切と認定して強い非難や公式な譴責を表明する三段階の図。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24738a"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><g font-family="sans-serif"><text x="32" y="51" font-size="29" fill="#245f73" font-weight="700">censure</text><text x="32" y="82" font-size="18" fill="#536770">行為を評価し、厳しい非難・公式な譴責を表明する</text><rect x="30" y="105" width="780" height="220" rx="12" fill="#f2f7f8"/><rect x="60" y="159" width="195" height="121" rx="14" fill="#e2eef2" stroke="#83aab8" stroke-width="2"/><text x="158" y="210" font-size="25" text-anchor="middle" fill="#245f73" font-weight="700">行動</text><text x="158" y="246" font-size="18" text-anchor="middle" fill="#245f73">conduct</text><path d="M265 220H306" stroke="#24738a" stroke-width="5" marker-end="url(#a)"/><rect x="318" y="159" width="195" height="121" rx="14" fill="#e4edf2" stroke="#8fa6bd" stroke-width="2"/><text x="416" y="210" font-size="25" text-anchor="middle" fill="#405d7a" font-weight="700">評価・判断</text><text x="416" y="246" font-size="18" text-anchor="middle" fill="#405d7a">judgment</text><path d="M523 220H564" stroke="#24738a" stroke-width="5" marker-end="url(#a)"/><rect x="576" y="159" width="195" height="121" rx="14" fill="#f8e7e0" stroke="#c98875" stroke-width="2"/><text x="674" y="210" font-size="25" text-anchor="middle" fill="#9b4d38" font-weight="700">厳しい非難</text><text x="674" y="246" font-size="18" text-anchor="middle" fill="#9b4d38">censure</text><text x="420" y="312" font-size="16" text-anchor="middle" fill="#536770">単なる批評ではなく、強い不承認を示す</text></g></svg>