<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">transparent core image</title><desc id="desc">不透明な壁と内部の情報が見える透明な窓を対比する図。</desc><defs><marker id="blueArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26738a"/></marker><marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#db934b"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dbe5e9" stroke-width="2"/><text x="32" y="48" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="28" font-weight="750" fill="#245f73">transparent</text><text x="32" y="79" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="400" fill="#536974">向こう側が見通せる → 情報や意図が隠されていない</text><rect x="26" y="101" width="788" height="227" rx="12" fill="#f2f7f8" stroke="none" stroke-width="2"/><rect x="75" y="145" width="202" height="130" rx="12" fill="#cbd5d9" stroke="#8ca2aa" stroke-width="2"/><text x="177" y="176" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="700" fill="#536974">不透明</text>
<circle cx="178" cy="231" r="31" fill="#768d98" stroke="none" stroke-width="2"/><path d="M297 215 L389 215" fill="none" stroke="#26738a" stroke-width="4" stroke-linecap="round" marker-end="url(#blueArrow)" />
<rect x="416" y="145" width="344" height="130" rx="12" fill="#e3f2f4" stroke="#78b0bd" stroke-width="2"/><text x="585" y="176" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="700" fill="#245f73">透明・見通せる</text>
<rect x="492" y="193" width="182" height="64" rx="12" fill="#fff" stroke="#78b0bd" stroke-width="2"/><text x="585" y="232" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="19" font-weight="700" fill="#245f73">中身が見える</text><path d="M453 225H483 M680 225H729" fill="none" stroke="#26738a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blueArrow)" /><text x="420" y="310" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="17" font-weight="500" fill="#536974">物理的な透明 → 説明責任・情報開示</text></svg>