<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title description"><title id="title">hiatus のコアイメージ</title><desc id="description">活動の時間軸が空白によって途切れるイメージ。</desc><defs><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#24738a"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#e19c52"/></marker></defs><rect width="840" height="360" rx="16" fill="#ffffff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dfe8eb" stroke-width="2"/><text x="32" y="51" font-size="29" font-weight="700" fill="#245f73" text-anchor="start">hiatus</text><text x="32" y="83" font-size="17" font-weight="400" fill="#536770" text-anchor="start">続いていた流れの途中に、ぽっかり空白が生じる</text>
  <rect x="31" y="114" width="778" height="206" rx="12" fill="#f2f7f8"/>
  <text x="58" y="153" font-size="17" font-weight="400" fill="#536770" text-anchor="start">活動・時間などの連続した流れ</text>
  <path d="M90 214H300" stroke="#24738a" stroke-width="12" stroke-linecap="round"/>
  <path d="M518 214H744" stroke="#24738a" stroke-width="12" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <rect x="327" y="175" width="165" height="78" rx="12" fill="#fff5e8" stroke="#e1a45f" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="410" y="210" font-size="24" font-weight="700" fill="#ad6b2b" text-anchor="middle">hiatus</text>
  <text x="410" y="236" font-size="16" font-weight="500" fill="#ad6b2b" text-anchor="middle">中断・空白</text>
  <text x="197" y="261" font-size="16" font-weight="600" fill="#344653" text-anchor="middle">それまでの活動</text>
  <text x="641" y="261" font-size="16" font-weight="600" fill="#344653" text-anchor="middle">再開後の活動</text>
  <text x="410" y="303" font-size="16" font-weight="400" fill="#536770" text-anchor="middle">「休憩」だけではなく、連続性にできた切れ目を表す</text>
</svg>