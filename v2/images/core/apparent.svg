<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">apparent core image</title><desc id="desc">目に映ったものが明らかである場合と見かけだけの場合がある図。</desc><defs><marker id="blueArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26738a"/></marker><marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#db934b"/></marker></defs><rect width="840" height="360" rx="16" fill="#fff"/><rect x="1" y="1" width="838" height="358" rx="15" fill="none" stroke="#dbe5e9" stroke-width="2"/><text x="32" y="48" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="28" font-weight="750" fill="#245f73">apparent</text><text x="32" y="79" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="400" fill="#536974">明らかに見えること／見かけ上はそう見えること</text><rect x="26" y="101" width="788" height="227" rx="12" fill="#f2f7f8" stroke="none" stroke-width="2"/><circle cx="187" cy="206" r="58" fill="#d1e9ed" stroke="none" stroke-width="2"/><circle cx="187" cy="206" r="20" fill="#26738a" stroke="none" stroke-width="2"/><path d="M103 204 Q187 125 270 204 Q187 285 103 204" fill="none" stroke="#26738a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"  />
<text x="187" y="297" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="18" font-weight="700" fill="#245f73">目に見えること</text>
<path d="M289 206 L375 206" fill="none" stroke="#26738a" stroke-width="4" stroke-linecap="round" marker-end="url(#blueArrow)" />
<rect x="406" y="146" width="353" height="118" rx="12" fill="#fff2e4" stroke="#db934b" stroke-width="2"/><text x="582" y="182" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="19" font-weight="700" fill="#ad6b2b">明白に見て取れる</text><text x="582" y="220" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="16" font-weight="500" fill="#344653">または</text><text x="582" y="249" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="19" font-weight="700" fill="#ad6b2b">外見上はそう見える</text><text x="417" y="317" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="17" font-weight="500" fill="#536974">見えることと、実際に正しいことは別</text></svg>